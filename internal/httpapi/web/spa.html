<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #f5f6f8; color: #14171a;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .page { max-width: 480px; margin: 0 auto; padding: 72px 16px 48px; }
    .card { background: #fff; border: 1px solid #e6e8eb; border-radius: 14px; padding: 36px 40px; }
    h1 { font-size: 24px; margin: 0 0 6px; text-align: center; }
    .sub { color: #5f6b7a; text-align: center; margin: 0 0 28px; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); z-index: 10; }
    .toast { padding: 11px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 4px 16px rgba(20, 23, 26, .12); }
    .toast.ok { background: #e7f6ec; color: #17623a; }
    .toast.error { background: #fdecec; color: #a12622; }
    .toast.info { background: #eef1f5; color: #3a4553; }
    .provider {
      display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px 16px;
      font: inherit; font-weight: 600; color: #14171a; background: #fff; text-decoration: none;
      border: 1px solid #d5d9de; border-radius: 10px; cursor: pointer; margin-bottom: 10px;
    }
    .provider:hover { background: #f7f8fa; border-color: #b9bfc7; }
    .icon { width: 24px; height: 24px; display: inline-flex; flex: none; }
    .icon svg { width: 100%; height: 100%; }
    .brand { display: block; width: 76px; height: 76px; margin: 0 auto 12px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .field input {
      width: 100%; font: inherit; padding: 11px 14px; color: #14171a; background: #fff;
      border: 1px solid #d5d9de; border-radius: 10px;
    }
    .field input::placeholder { color: #9aa3ae; }
    .field input:hover { border-color: #b9bfc7; }
    .field input:focus-visible { outline: 2px solid #2563eb; outline-offset: 0; border-color: #2563eb; }
    .field input[aria-invalid="true"] { border-color: #d92d20; }
    .field .error { color: #a12622; font-size: 13px; margin-top: 6px; }
    .primary-button {
      display: block; width: 100%; font: inherit; font-weight: 600; padding: 12px 16px; color: #fff;
      background: #14171a; border: 0; border-radius: 10px; cursor: pointer;
    }
    .primary-button:hover { background: #2a2f36; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: #8a94a1; font-size: 13px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e6e8eb; }
    .switch { margin: 24px 0 0; text-align: center; font-size: 14px; color: #5f6b7a; }
    .link {
      font: inherit; font-weight: 600; color: #14171a; background: none; border: 0; padding: 0;
      cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    }
    .provider:last-of-type { margin-bottom: 0; }
    .head { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%; background: #dfe3e8; color: #4a5563; flex: none;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; object-fit: cover;
    }
    .who { flex: 1; min-width: 0; }
    .name { font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .email { color: #5f6b7a; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .signout {
      display: block; width: 100%; margin-top: 28px; padding: 12px 16px; font: inherit; font-weight: 600;
      color: #fff; background: #d92d20; border: 0; border-radius: 10px; cursor: pointer;
    }
    .signout:hover { background: #b42318; }
    h2 { font-size: 15px; margin: 28px 0 4px; }
    .hint { color: #5f6b7a; font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #eef0f2; }
    .row .info { flex: 1; min-width: 0; line-height: 1.3; }
    .row .label { display: block; font-weight: 600; }
    .row .state { display: block; color: #17623a; font-size: 13px; }
    .row .state.off { color: #8a94a1; }
    .small {
      font: inherit; font-size: 14px; font-weight: 600; padding: 7px 12px; width: 132px; white-space: nowrap; flex: none;
      background: #fff; color: #14171a; border: 1px solid #d5d9de; border-radius: 8px; cursor: pointer;
    }
    .small:hover:not([disabled]) { background: #f7f8fa; }
    .small.primary { background: #14171a; color: #fff; border-color: #14171a; }
    .small.primary:hover { background: #2a2f36; }
    .small[disabled] { color: #aab1ba; cursor: not-allowed; }
    .small.danger { background: #fdecec; color: #a12622; border-color: #f3c4c1; }
    .small.danger:hover:not([disabled]) { background: #fbdcda; }
    .small.busy, .provider.busy { opacity: .65; pointer-events: none; }
    .toast { display: flex; align-items: flex-start; gap: 10px; }
    .toast span { flex: 1; }
    .toast button {
      font: inherit; line-height: 1; padding: 0 2px; border: 0; background: none; color: inherit;
      opacity: .6; cursor: pointer; font-size: 18px;
    }
    .toast button:hover { opacity: 1; }
    .since { color: #8a94a1; font-size: 13px; }
    .footer { margin-top: 20px; text-align: center; font-size: 13px; color: #8a94a1; }
    .footer a { color: #5f6b7a; }
    .loading { display: flex; justify-content: center; padding: 56px 0; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%; border: 3px solid #e6e8eb; border-top-color: #5f6b7a;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    @media (max-width: 520px) { .page { padding-top: 32px; } .card { padding: 24px 18px; } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="app">
    <main class="page">
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="card" id="card"><div class="loading"><div class="spinner" role="progressbar" aria-label="Loading"></div></div></div>
      <p class="footer" id="footer"></p>
    </main>
  </div>

  <script>
    const API = "%API%";

    const PROVIDERS = [
      { id: 'google', name: 'Google' },
      { id: 'facebook', name: 'Facebook' },
      { id: 'telegram', name: 'Telegram' },
    ];

    const MESSAGES = {
      access_denied: 'Sign-in was cancelled. Nothing was changed.',
      invalid_state: 'That sign-in link has expired. Please try again.',
      provider_error: 'We could not finish signing you in. Please try again.',
      internal_error: 'Something went wrong on our side. Please try again.',
      identity_taken: 'That account already has its own profile. Sign in with it to use that profile.',
      already_linked: 'That account is already connected.',
      last_identity: 'You need at least one way to sign in, so the last one cannot be removed.',
      not_linked: 'That account is not connected.',
      provider_not_found: 'That sign-in option is not available right now.',
      token_missing: 'Your session has ended. Please sign in again.',
      token_invalid: 'Your session has ended. Please sign in again.',
    };

    const state = { token: null, user: null };
    let refreshing = null;

    function h(tag, props, ...children) {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (key === 'class') el.className = value;
        else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
        else if (value === true) el.setAttribute(key, '');
        else if (value !== false && value != null) el.setAttribute(key, value);
      }
      for (const child of children.flat()) {
        if (child != null && child !== false) el.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return el;
    }

    const ICONS = {
      google: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.72-4.95H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.28 14.29A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.38-2.29v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4.01-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.44-3.44C17.95 1.19 15.23 0 12 0A12 12 0 0 0 1.27 6.61l4.01 3.1C6.23 6.88 8.88 4.77 12 4.77z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.45 18.63.07 12 .07S0 5.45 0 12.07c0 5.99 4.39 10.95 10.13 11.85v-8.39H7.08v-3.47h3.05V9.43c0-3.01 1.79-4.67 4.53-4.67 1.31 0 2.69.23 2.69.23v2.95h-1.51c-1.49 0-1.96.93-1.96 1.87v2.25h3.33l-.53 3.47h-2.8v8.39C19.61 23.02 24 18.06 24 12.07z"/></svg>',
      telegram: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#229ED9"/><path fill="#fff" d="M5.43 11.87c3.5-1.52 5.83-2.53 7-3.01 3.33-1.39 4.02-1.63 4.47-1.64.1 0 .32.02.47.14.12.1.16.23.17.33.02.09.04.31.02.47-.18 1.9-.96 6.5-1.36 8.63-.17.9-.5 1.2-.82 1.23-.7.06-1.23-.46-1.9-.9-1.06-.7-1.65-1.13-2.68-1.8-1.19-.78-.42-1.21.26-1.91.18-.18 3.25-2.98 3.31-3.23.01-.03.01-.15-.06-.21-.07-.06-.17-.04-.25-.02-.11.02-1.8 1.14-5.06 3.35-.48.33-.91.49-1.3.48-.43-.01-1.25-.24-1.87-.44-.75-.25-1.35-.37-1.3-.79.03-.22.33-.44.89-.67z"/></svg>',
    };

    function icon(p) {
      const el = h('span', { class: 'icon' });
      el.innerHTML = ICONS[p.id];
      return el;
    }

    function brandMark() {
      return h('img', { class: 'brand', src: '/logo.png', alt: 'Alifco', width: 76, height: 76 });
    }

    async function api(method, path, options) {
      const { auth = false, csrf = false, retry = true } = options || {};
      const headers = {};
      if (auth && state.token) headers.Authorization = 'Bearer ' + state.token;
      if (csrf) headers['X-Requested-With'] = 'fetch';
      const res = await fetch(API + path, { method, credentials: 'include', headers });
      const body = await res.json().catch(() => null);
      const code = body && body.error && body.error.code;
      if (auth && retry && res.status === 401 && code === 'token_expired' && (await refresh())) {
        return api(method, path, { auth, csrf, retry: false });
      }
      return { ok: res.ok, status: res.status, body, code };
    }

    function refresh() {
      if (!refreshing) {
        refreshing = api('POST', '/auth/refresh', { csrf: true })
          .then((r) => {
            state.token = r.ok ? r.body.accessToken : null;
            return r.ok;
          })
          .finally(() => { refreshing = null; });
      }
      return refreshing;
    }

    async function loadUser() {
      const r = await api('GET', '/me', { auth: true });
      state.user = r.ok ? r.body : null;
      return r.ok;
    }

    let toastTimer;
    function toast(kind, text) {
      clearTimeout(toastTimer);
      const box = document.getElementById('toast');
      if (!text) return box.replaceChildren();
      box.replaceChildren(h('div', { class: 'toast ' + kind, role: kind === 'error' ? 'alert' : null },
        h('span', null, text),
        h('button', { type: 'button', 'aria-label': 'Dismiss', onclick: () => box.replaceChildren() }, '\u00d7')));
      if (kind !== 'error') toastTimer = setTimeout(() => box.replaceChildren(), 6000);
    }

    async function busy(button, label, work) {
      const original = button.textContent;
      button.classList.add('busy');
      button.setAttribute('aria-busy', 'true');
      button.textContent = label;
      try { return await work(); }
      finally {
        button.classList.remove('busy');
        button.removeAttribute('aria-busy');
        if (button.isConnected) button.textContent = original;
      }
    }

    const providerName = (id) => (PROVIDERS.find((p) => p.id === id) || { name: id }).name;

    async function connect(id) {
      if (!state.token && !(await refresh())) return toast('error', MESSAGES.token_missing);
      const r = await api('POST', '/auth/link/' + id, { auth: true });
      if (r.ok) location.href = r.body.url;
      else toast('error', MESSAGES[r.code] || MESSAGES.internal_error);
    }

    async function disconnect(id) {
      toast();
      const r = await api('DELETE', '/auth/link/' + id, { auth: true });
      if (r.ok) {
        toast('ok', providerName(id) + ' disconnected.');
        await loadUser();
      } else {
        toast('error', MESSAGES[r.code] || MESSAGES.internal_error);
      }
      render();
    }

    async function signOut() {
      await api('POST', '/auth/logout', { csrf: true });
      state.token = null;
      state.user = null;
      toast('info', 'You have been signed out.');
      render();
    }

    let authMode = 'signin';

    const COPY = {
      signin: {
        title: 'Welcome back',
        sub: 'Sign in to continue to Alifco',
        submit: 'Continue with email',
        switchText: "Don't have an account?",
        switchAction: 'Sign up',
        title2: 'Sign in',
      },
      signup: {
        title: 'Create your account',
        sub: 'Get started with Alifco in a minute',
        submit: 'Continue with email',
        switchText: 'Already have an account?',
        switchAction: 'Sign in',
        title2: 'Sign up',
      },
    };

    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function emailForm() {
      const input = h('input', {
        id: 'email', name: 'email', type: 'email', autocomplete: 'email', inputmode: 'email',
        placeholder: 'you@example.com', 'aria-describedby': 'email-error', required: true,
      });
      const error = h('div', { class: 'error', id: 'email-error', role: 'alert' });
      input.addEventListener('input', () => {
        input.removeAttribute('aria-invalid');
        error.textContent = '';
      });
      const form = h('form', { novalidate: true },
        h('div', { class: 'field' }, h('label', { for: 'email' }, 'Email'), input, error),
        h('button', { type: 'submit', class: 'primary-button' }, COPY[authMode].submit));
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!EMAIL_PATTERN.test(input.value.trim())) {
          input.setAttribute('aria-invalid', 'true');
          error.textContent = input.value.trim() ? 'Enter a valid email address.' : 'Enter your email address.';
          input.focus();
          return;
        }
        toast('info', 'Signing in with email is not available yet. Please continue with one of the options below.');
      });
      return form;
    }

    function renderSignedOut() {
      const copy = COPY[authMode];
      return [
        brandMark(),
        h('h1', null, copy.title),
        h('p', { class: 'sub' }, copy.sub),
        emailForm(),
        h('div', { class: 'divider', role: 'separator' }, 'or'),
        PROVIDERS.map((p) => h('a', {
          class: 'provider',
          href: API + '/auth/' + p.id,
          onclick: (e) => e.currentTarget.classList.add('busy'),
        }, icon(p), 'Continue with ' + p.name)),
        h('p', { class: 'switch' }, copy.switchText + ' ',
          h('button', {
            type: 'button',
            class: 'link',
            onclick: () => { authMode = authMode === 'signin' ? 'signup' : 'signin'; toast(); render(); },
          }, copy.switchAction)),
      ];
    }

    function avatarImage(src, initial) {
      const img = h('img', { class: 'avatar', src, alt: '', referrerpolicy: 'no-referrer' });
      img.addEventListener('error', () => img.replaceWith(h('div', { class: 'avatar' }, initial)));
      return img;
    }

    function connectButton(p) {
      const button = h('button', { type: 'button', class: 'small primary', 'aria-label': 'Connect ' + p.name }, 'Connect');
      button.addEventListener('click', () => busy(button, 'Connecting\u2026', () => connect(p.id)));
      return button;
    }

    function disconnectButton(p, onlyOne) {
      const button = h('button', {
        type: 'button',
        class: 'small',
        disabled: onlyOne,
        'aria-label': 'Disconnect ' + p.name,
        title: onlyOne ? 'You need at least one way to sign in' : '',
      }, 'Disconnect');
      let armed;
      button.addEventListener('click', () => {
        if (!armed) {
          armed = setTimeout(() => { armed = null; button.textContent = 'Disconnect'; button.classList.remove('danger'); }, 4000);
          button.textContent = 'Are you sure?';
          button.classList.add('danger');
          return;
        }
        clearTimeout(armed);
        busy(button, 'Disconnecting\u2026', () => disconnect(p.id));
      });
      return button;
    }

    const memberSince = (iso) => {
      const date = new Date(iso);
      return isNaN(date) ? '' : 'Member since ' + date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    };

    function renderSignedIn() {
      const user = state.user;
      const linked = new Set(user.providers);
      const onlyOne = linked.size <= 1;
      const initial = (user.name || '?').trim().charAt(0).toUpperCase();

      return [
        h('div', { class: 'head' },
          user.avatarUrl
            ? avatarImage(user.avatarUrl, initial)
            : h('div', { class: 'avatar' }, initial),
          h('div', { class: 'who' },
            h('div', { class: 'name' }, user.name),
            user.email ? h('div', { class: 'email' }, user.email) : null,
            user.createdAt ? h('div', { class: 'since' }, memberSince(user.createdAt)) : null)),
        h('h2', null, 'Connected accounts'),
        h('p', { class: 'hint' }, 'Connect more accounts to sign in with any of them.'),
        PROVIDERS.map((p) => {
          const on = linked.has(p.id);
          return h('div', { class: 'row' },
            icon(p),
            h('div', { class: 'info' },
              h('span', { class: 'label' }, p.name),
              h('span', { class: 'state' + (on ? '' : ' off') }, on ? 'Connected' : 'Not connected')),
            on ? disconnectButton(p, onlyOne) : connectButton(p));
        }),
        h('button', { type: 'button', class: 'signout', onclick: (e) => busy(e.currentTarget, 'Signing out\u2026', signOut) }, 'Sign out'),
      ];
    }

    function render() {
      document.title = state.user ? 'Your account' : COPY[authMode].title2;
      const content = state.user ? renderSignedIn() : renderSignedOut();
      document.getElementById('card').replaceChildren(...content.flat(Infinity));
      document.getElementById('footer').replaceChildren(h('a', { href: API + '/docs', target: '_blank', rel: 'noopener' }, 'API documentation'));
    }

    async function init() {
      const params = new URLSearchParams(location.search);
      const error = params.get('error');
      const linked = params.get('linked');
      const fromCallback = location.pathname === '/auth/callback';

      if (location.pathname !== '/') history.replaceState(null, '', '/');

      const signedIn = (await refresh()) && (await loadUser());
      if (error) toast('error', MESSAGES[error] || MESSAGES.internal_error);
      else if (linked) toast('ok', providerName(linked) + ' connected.');
      else if (signedIn && fromCallback) toast('ok', 'Welcome, ' + state.user.name + '.');
      render();
    }

    init();
  </script>
</body>
</html>
