version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # Token endpoint URLs, not credentials.
        - G101
        # Cookie attributes come from validated configuration.
        - G124
        # Redirect targets are built from configuration and provider adapters, never from request input.
        - G710
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx]

formatters:
  enable:
    - gofmt
    - goimports
